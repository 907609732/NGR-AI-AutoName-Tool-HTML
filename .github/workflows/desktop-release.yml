name: Desktop Release Draft

on:
  workflow_dispatch:
  push:
    tags:
      - "v3.*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      npm_config_cache: ${{ github.workspace }}\.cache\npm
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.cache\ms-playwright
      TEMP: ${{ github.workspace }}\.tmp
      TMP: ${{ github.workspace }}\.tmp
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare project-local directories
        shell: pwsh
        run: New-Item -ItemType Directory -Force .cache/npm,.cache/electron,.cache/electron-builder,.cache/ms-playwright,.tmp,logs | Out-Null
      - name: Install exact dependencies
        run: npm ci
      - name: Test and build unsigned release
        run: |
          npm test
          npm run build
      - name: Upload reproducible build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NGR-AssetPilot-3.0.0-Windows-x64
          path: |
            artifacts/release/*.exe
            artifacts/release/*.blockmap
            artifacts/release/latest.yml
            artifacts/release/SHA256SUMS.txt
            artifacts/release/sbom.cdx.json
            artifacts/release/build-manifest.json
          if-no-files-found: error
      - name: Create draft GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/release/*.exe
            artifacts/release/*.blockmap
            artifacts/release/latest.yml
            artifacts/release/SHA256SUMS.txt
            artifacts/release/sbom.cdx.json
            artifacts/release/build-manifest.json
